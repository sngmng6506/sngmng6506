name: Daily profile views

on:
  schedule:
    - cron: '17 0 * * *' # Daily at 09:17 KST (GitHub may delay scheduled runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-views.yml', 'scripts/profile-views.py']

permissions:
  contents: write

concurrency:
  group: profile-views
  cancel-in-progress: false

jobs:
  graph:
    runs-on: ubuntu-24.04
    steps:
      # Data and graph live on master so the profile's main branch only gets a README link change.
      - uses: actions/checkout@v5
        with:
          ref: master
          path: data

      - uses: actions/checkout@v5
        with:
          ref: main
          path: profile

      - name: Record komarev total and render daily views
        working-directory: data
        run: python ../profile/scripts/profile-views.py

      - name: Save data and graph
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add views/history.json views/daily.svg
          git commit -m "Record daily profile views"
          git pull --rebase origin master
          git push origin HEAD:master
          echo "GRAPH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Point README at the new graph
        working-directory: profile
        shell: python
        run: |
          import os, pathlib, re
          p = pathlib.Path("README.md")
          text = p.read_text()
          badge = '<img src="https://komarev.com/ghpvc/?username=sngmng6506&label=Profile%20views&color=888888" alt="Profile views">'
          graph = f'<img src="https://raw.githubusercontent.com/sngmng6506/sngmng6506/{os.environ["GRAPH_COMMIT"]}/views/daily.svg" alt="Daily profile views" width="100%">'
          block = "<!-- daily-repository-views -->\n" + badge + "\n\n" + graph + "\n<!-- /daily-repository-views -->"
          pattern = r"<!-- daily-repository-views -->.*?<!-- /daily-repository-views -->"
          if re.search(pattern, text, flags=re.S):
              text = re.sub(pattern, lambda _: block, text, flags=re.S)
          else:
              text = text.rstrip("\n") + "\n\n" + block + "\n"
          p.write_text(text)

      - name: Save README link
        working-directory: profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update daily profile views graph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
