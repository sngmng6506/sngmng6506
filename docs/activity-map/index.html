<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="이상명의 서비스, 연구 노트, 커뮤니티를 연결하는 인터랙티브 활동 지도."><title>Sangmyeong — Activity Atlas</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="https://github.com/sngmng6506"><span class="brand-mark">s.</span><span>SANGMYEONG <small>ACTIVITY ATLAS</small></span></a><div class="header-right"><span class="live-dot"></span><span>Build. Write. Connect.</span><a href="https://github.com/sngmng6506/sngmng6506">GitHub ↗</a></div></header>
<main><svg id="map" aria-label="활동 관계 지도. 노드를 선택하거나 검색해 탐색하세요." role="group"><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#292b31"/></pattern></defs><rect width="100%" height="100%" fill="url(#dots)"/><g id="world"><g id="edges"></g><g id="nodes"></g></g></svg>
<section class="intro"><p class="eyebrow">A CONNECTED PRACTICE</p><h1>작업과 생각이<br>만나는 곳.</h1><p>서비스를 만들고, 과정을 기록하고,<br>함께 배우는 활동의 연결 지도.</p><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="활동·주제 검색" aria-label="활동 및 주제 검색"><kbd>/</kbd></label><div id="results" class="results" aria-live="polite"></div><nav id="filters" aria-label="활동 종류 필터"></nav></section>
<aside id="detail" aria-label="선택한 활동 상세" hidden><button id="close-detail" class="close" aria-label="상세 닫기">×</button><p id="detail-group" class="eyebrow"></p><h2 id="detail-title"></h2><p id="detail-description"></p><a id="detail-link" target="_blank" rel="noopener noreferrer">사이트 열기 ↗</a><div class="connection-heading">CONNECTED TO</div><div id="connections"></div></aside>
<div class="controls"><button id="zoom-in" aria-label="확대">+</button><button id="zoom-out" aria-label="축소">−</button><span></span><button id="fit" aria-label="전체 보기">↗</button></div><footer><span id="level" aria-live="polite">OVERVIEW</span><span class="hint">스크롤로 확대 · 드래그로 이동 · 노드를 눌러 탐색</span><span id="count"></span></footer><div id="error" role="alert" hidden>지도를 불러오지 못했습니다. 새로고침해 주세요.</div></main>
<script type="module" src="app.js"></script></body></html>
